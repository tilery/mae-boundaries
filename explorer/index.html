<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Outil d'exploration des frontières MEAE</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --included: #2e7d32;
            --excluded: #ef6c00;
            --disputed: #d32f2f;
            --border: #ddd;
            --muted: #555;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font: 14px/1.4 system-ui, sans-serif;
        }
        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-areas: "countries map";
            height: 100vh;
        }
        .countries {
            grid-area: countries;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-right: 1px solid #bbb;
        }
        .controls {
            padding: 5px;
            border-bottom: 1px solid var(--border);
        }
        input[type="search"] {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        .status {
            margin: 5px 0 0;
            color: var(--muted);
        }
        .status[data-state="error"] {
            color: var(--disputed);
        }
        .countries ul {
            flex: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }
        .countries li {
            padding: 4px 10px;
            list-style: none;
            border-bottom: 1px solid var(--border);
        }
        .countries li[aria-current="true"] {
            background: #eef4ff;
        }
        dl {
            margin: 4px 0 4px 10px;
        }
        dt {
            font-size: .85em;
            color: var(--muted);
        }
        dd {
            margin: 0 0 0 10px;
        }
        dd::before {
            content: "■";
            margin-right: 4px;
        }
        dd.included::before {
            color: var(--included);
        }
        dd.excluded::before {
            color: var(--excluded);
        }
        button {
            cursor: pointer;
            border: none;
            background-color: transparent;
            font: inherit;
        }
        .map {
            grid-area: map;
        }
        #map {
            height: 100%;
            width: 100%;
        }
    </style>

</head>
<body>
    <main>
        <section class="countries">
            <div class="controls">
                <input type="search" placeholder="Chercher…" aria-label="Chercher un pays">
                <p class="status" role="status">Chargement…</p>
            </div>
            <ul></ul>
        </section>
        <section class="map"><div id="map"></div></section>
    </main>

<script>
"use strict"

const BASE = new URLSearchParams(location.search).get("base") || "https://nuage.face-b.in"

const map = L.map("map").setView([20, 0], 2)
L.tileLayer("https://{s}.piano.tiles.quaidorsay.fr/fr{r}/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map)

const palette = getComputedStyle(document.documentElement)
const color = (name) => palette.getPropertyValue(name).trim()

const selection = L.geoJSON().addTo(map)
const areas = L.geoJSON(null, {
    style: (feature) => ({color: color(`--${feature.properties.kind}`), weight: 2})
}).addTo(map)
const disputed = L.geoJSON(null, {style: {color: color("--disputed"), weight: 1}})
L.control.layers(null, {"Zones contestées": disputed}).addTo(map)

const ul = document.querySelector(".countries ul")
const status = document.querySelector(".status")
const search = document.querySelector('input[type="search"]')

const setStatus = (message, state) => {
    status.textContent = message
    status.dataset.state = state
}

const nameOf = (properties) => properties["name:fr"] || properties["name"]
const labelOf = (properties) => properties["name:fr"]
    ? `${properties["name:fr"]} (${properties["iso3"]})`
    : properties["name"]

const hasGeometry = (geometry) => Boolean(geometry?.coordinates?.length)

const fitTo = (layer) => {
    const bounds = layer.getBounds()
    if (bounds.isValid()) map.fitBounds(bounds)
}

const viewButton = (label, onClick) => {
    const button = document.createElement("button")
    button.type = "button"
    button.textContent = "👁"
    button.title = label
    button.setAttribute("aria-label", label)
    button.addEventListener("click", onClick)
    return button
}

const showCountry = (feature, li) => {
    selection.clearLayers()
    areas.clearLayers()
    selection.addData(feature.geometry)
    fitTo(selection)
    for (const current of ul.querySelectorAll("li[aria-current]")) {
        current.removeAttribute("aria-current")
    }
    li.setAttribute("aria-current", "true")
}

const showArea = (area, kind) => {
    areas.addData({type: "Feature", geometry: area.geojson, properties: {kind}})
}

const appendAreas = (li, title, list, kind) => {
    if (!list?.length) return
    const dl = document.createElement("dl")
    const dt = document.createElement("dt")
    dt.textContent = title
    dl.appendChild(dt)
    for (const area of list) {
        const dd = document.createElement("dd")
        dd.className = kind
        dd.textContent = area.name
        if (hasGeometry(area.geojson)) {
            dd.appendChild(viewButton(`Afficher ${area.name}`, () => showArea(area, kind)))
        }
        dl.appendChild(dd)
    }
    li.appendChild(dl)
}

const render = (features) => {
    const sorted = features.toSorted((a, b) =>
        nameOf(a.properties).localeCompare(nameOf(b.properties), "fr"))
    for (const feature of sorted) {
        const properties = feature.properties
        const label = labelOf(properties)
        const li = document.createElement("li")
        li.dataset.search = [
            properties["name:fr"], properties["name"], properties["name:en"],
            properties["iso"], properties["iso3"]
        ].filter(Boolean).join(" ").toLowerCase()
        const span = document.createElement("span")
        span.textContent = label
        li.appendChild(span)
        if (hasGeometry(feature.geometry)) {
            span.appendChild(viewButton(`Afficher ${label}`, () => showCountry(feature, li)))
        }
        appendAreas(li, "Zones incluses", feature.included, "included")
        appendAreas(li, "Zones exclues", feature.excluded, "excluded")
        ul.appendChild(li)
    }
    setStatus(`${sorted.length} pays`, "ready")
}

search.addEventListener("input", () => {
    const needle = search.value.trim().toLowerCase()
    let matching = 0
    for (const li of ul.children) {
        li.hidden = !li.dataset.search.includes(needle)
        if (!li.hidden) matching++
    }
    setStatus(needle ? `${matching} pays sur ${ul.children.length}` : `${matching} pays`, "ready")
})

const load = async (name, onProgress) => {
    const response = await fetch(`${BASE}/${name}`)
    if (!response.ok) throw new Error(`${name} : HTTP ${response.status}`)
    const total = Number(response.headers.get("Content-Length"))
    if (!onProgress || !total || !response.body) return response.json()
    const reader = response.body.getReader()
    const chunks = []
    let loaded = 0
    let shown = -1
    for (;;) {
        const {done, value} = await reader.read()
        if (done) break
        chunks.push(value)
        loaded += value.length
        const percent = Math.floor((loaded / total) * 100)
        if (percent !== shown) {
            shown = percent
            onProgress(percent)
        }
    }
    return JSON.parse(await new Blob(chunks).text())
}

const start = async () => {
    setStatus("Chargement…", "loading")
    const failures = []
    await Promise.all([
        load("boundary.json", (percent) => setStatus(`Chargement des frontières… ${percent} %`, "loading")).then(
            (data) => render(data.features),
            (error) => failures.push(error.message)
        ),
        load("disputed.json").then(
            (data) => disputed.addData(data),
            (error) => failures.push(error.message)
        )
    ])
    if (failures.length) {
        setStatus(`Chargement impossible depuis ${BASE} — ${failures.join(" ; ")}`, "error")
    }
}

start()

</script>
</body>
</html>
